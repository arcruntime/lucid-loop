        <meta itemprop='text' content='Hello👋I’m on a project in the style of the Arcane series, I’d like to get this stylized effect but everything I tried was not good… So I’d like to know if a simple Post Process Cell Shader effect can do this result or ho…'>

            <div class='post' itemprop="text">
              <p>Greetings <a class="mention" href="/u/pepinderaisin">@pepinderaisin</a>! Let’s see what we can do here.</p>
<p>Arcane’s artstyle consists mostly on very detailed, hand painted textures in stylized. Shaders definitely help, but most of the work will be on the painting.</p>
<p>From my own experiments, these tutorials were very helpful. Also added a possible method for an arcane shader, using Blender. Hope this helps!</p>
