name: Unity builds

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.platform }} gyms
    # Never run fork code on the private build machines.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            labels: '["self-hosted", "Windows", "X64", "stadia-testbed", "lucid-loop"]'
            python: python
            editor_variable: UNITY_EDITOR_WINDOWS
          # macOS builds are deferred; see docs/CI.md before restoring this lane.
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      UNITY_EDITOR: ${{ vars[matrix.editor_variable] }}
    steps:
      - uses: actions/checkout@v4
        # Fetch Unity payloads while checkout still has authentication. Keep
        # authoring-only art as pointers; materialize Unity in the next step.
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          GIT_CONFIG_COUNT: "3"
          GIT_CONFIG_KEY_0: lfs.fetchinclude
          GIT_CONFIG_VALUE_0: Unity/**
          GIT_CONFIG_KEY_1: lfs.fetchexclude
          GIT_CONFIG_VALUE_1: ""
          GIT_CONFIG_KEY_2: lfs.fetchrecentalways
          GIT_CONFIG_VALUE_2: "false"
        with:
          lfs: true
          persist-credentials: false
          clean: true
      - name: Validate CI script checks
        run: ${{ matrix.python }} -m unittest discover -s tools/ci -v
      - name: Reclaim authoring-only LFS payloads in the CI checkout
        run: ${{ matrix.python }} tools/ci/materialize_unity_lfs.py --apply
      - name: Materialize fetched Unity assets
        run: git lfs checkout "Unity/**"
      - name: Test and build both gyms
        run: ${{ matrix.python }} tools/ci/build_gyms.py --platform ${{ matrix.platform }}
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: lucid-loop-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/packages/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload tests and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-diagnostics-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diagnostics/*
          if-no-files-found: warn
          retention-days: 14
