name: Native voice checks

on:
  push:
    paths:
      - "Unity/Assets/Gyms/Plugins/iOS/**"
      - ".github/workflows/native-voice.yml"
  pull_request:
    paths:
      - "Unity/Assets/Gyms/Plugins/iOS/**"
      - ".github/workflows/native-voice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-ring:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build portable ring tests
        run: >-
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread
          -DLLVOICE_RING_TEST_MAIN
          Unity/Assets/Gyms/Plugins/iOS/LLVoiceRingTests.cpp
          -o /tmp/llvoice-ring-tests
      - name: Check bounded audio storage and concurrent ordering
        run: /tmp/llvoice-ring-tests
      - name: Record scope
        run: echo 'Portable C++ ring checks only. Apple SDK compilation, AVAudioEngine and physical iOS audio acceptance remain separate.' >> "$GITHUB_STEP_SUMMARY"

  ios-sdk:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record Apple toolchain
        run: |
          xcodebuild -version | tee -a "$GITHUB_STEP_SUMMARY"
          xcrun --sdk iphoneos --show-sdk-version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compile and link native plugin for iOS 17 arm64
        run: |
          xcrun --sdk iphoneos clang++ \
            -target arm64-apple-ios17.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -std=c++17 -fno-exceptions -fno-objc-exceptions \
            -fobjc-arc -fexceptions -fobjc-exceptions -Wall -Wextra -Werror=unguarded-availability \
            -dynamiclib Unity/Assets/Gyms/Plugins/iOS/LLVoice.mm \
            -framework Foundation -framework AVFoundation -framework AudioToolbox \
            -o /tmp/LLVoice-check.dylib
          file /tmp/LLVoice-check.dylib
      - name: Record scope
        run: echo 'Native plugin compiled and linked against the Apple iOS SDK for arm64/iOS 17. This does not build/sign/install the Unity app or validate physical audio.' >> "$GITHUB_STEP_SUMMARY"
