name: Sign iOS development app

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful unsigned iOS build run ID
        required: true
        type: string
      build_attempt:
        description: Build run attempt
        default: '1'
        required: true
        type: string
      archive_sha256:
        description: Expected unsigned application archive SHA-256
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-unsigned-app-${{ inputs.build_run }}-${{ inputs.build_attempt }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/unsigned
      - name: Verify application archive
        env:
          EXPECTED_SHA: ${{ inputs.archive_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive = root / 'unsigned/LucidLoopGyms-unsigned-iphoneos.tar.gz'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA'].lower()
          destination = root / 'signed/Payload'
          destination.mkdir(parents=True)
          with tarfile.open(archive) as tar:
              for member in tar.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] == 'LucidLoopGyms.app'
                  assert member.isfile() or member.isdir()
              tar.extractall(destination, filter='data')
          PY
      - name: Import development identity and sign
        env:
          P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_DEVELOPMENT_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          signing="$RUNNER_TEMP/signing"
          mkdir -p "$signing"
          python3 - <<'PY'
          import base64, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'signing'
          for env, name in [('P12_BASE64', 'identity.p12'), ('PROFILE_BASE64', 'profile.mobileprovision')]:
              (root / name).write_bytes(base64.b64decode(os.environ[env], validate=True))
          PY
          keychain="$RUNNER_TEMP/lucid-loop-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing/identity.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          curl --fail --silent --show-error https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$signing/wwdr.cer"
          security import "$signing/wwdr.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security cms -D -i "$signing/profile.mobileprovision" > "$signing/profile.plist"
          python3 - <<'PY'
          import datetime, hashlib, os, pathlib, plistlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((root / 'signing/profile.plist').read_bytes())
          app = root / 'signed/Payload/LucidLoopGyms.app'
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          ent = profile['Entitlements']
          assert ent['application-identifier'] == profile['TeamIdentifier'][0] + '.' + info['CFBundleIdentifier']
          assert ent.get('get-task-allow') is True and profile.get('ProvisionedDevices')
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None)
          (root / 'signing/entitlements.plist').write_bytes(plistlib.dumps(ent))
          (root / 'signing/certificate-shas.txt').write_text('\n'.join(hashlib.sha1(c).hexdigest().upper() for c in profile['DeveloperCertificates']))
          (app / 'embedded.mobileprovision').write_bytes((root / 'signing/profile.mobileprovision').read_bytes())
          PY
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Apple Development/ {print $2; exit}')"
          test -n "$identity"
          grep -Fx "$identity" "$signing/certificate-shas.txt"
          app="$RUNNER_TEMP/signed/Payload/LucidLoopGyms.app"
          find "$app/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 | while IFS= read -r -d '' item; do
            codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none "$item"
          done
          codesign --force --sign "$identity" --keychain "$keychain" --timestamp=none --entitlements "$signing/entitlements.plist" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/signed"
          ditto -c -k --keepParent Payload "$RUNNER_TEMP/ipa/BeforeTheDrop-development.ipa"
          cd "$RUNNER_TEMP/ipa"
          shasum -a 256 BeforeTheDrop-development.ipa > BeforeTheDrop-development.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ios-development-ipa-${{ github.run_id }}
          path: ${{ runner.temp }}/ipa/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Remove temporary signing identity
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/lucid-loop-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/signing"
