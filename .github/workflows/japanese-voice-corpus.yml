name: Capture Japanese NPC voice evidence

on:
  push:
    paths:
      - '.github/workflows/japanese-voice-corpus.yml'
      - 'server/test-support/voice-capture.mjs'
      - 'server/test/voice-capture.test.mjs'
      - 'server/tools/collect-japanese-voices.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test server/test/voice-capture.test.mjs
  capture:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Collect four bounded native-voice samples
        run: node tools/collect-japanese-voices.mjs
        working-directory: server
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_GPT_LIVE_JAPANESE: '1'
          LIVE_JAPANESE_OUTPUT: ${{ runner.temp }}/japanese-npc-voices
      - name: Retain complete or partial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: japanese-npc-voices-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/japanese-npc-voices
          if-no-files-found: warn
          retention-days: 14
